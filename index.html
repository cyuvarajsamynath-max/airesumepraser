<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - Login</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app" class="auth-container">
      <h1>EduAI</h1>
      <p>Your Educational AI Assistant</p>
      
      <div class="auth-card">
        <h2>Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" required>
              <button type="button" id="toggle-password" class="toggle-btn">Show</button>
            </div>
          </div>
          <div id="auth-error" class="error-message"></div>
          <button type="submit" class="primary-btn" id="login-btn">Login</button>
        </form>
        
        <div class="auth-links">
          <a href="/reset-password.html">Forgot Password?</a>
          <span>Don't have an account? <a href="/signup.html">Create Account</a></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
