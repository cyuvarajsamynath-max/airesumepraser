<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - Dashboard</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="dashboard-body">
    <div id="app" class="dashboard-container">
      <header class="dashboard-header">
        <div class="logo">EduAI</div>
        <div class="user-info">
          <span id="user-name">Loading...</span>
          <span id="user-email" class="text-sm"></span>
          <button id="logout-btn" class="secondary-btn">Logout</button>
        </div>
      </header>
      
      <main class="chat-container">
        <div class="chat-header">
          <h2>Educational Assistant</h2>
          <button id="clear-chat-btn" class="text-btn">Clear Conversation</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <div class="message ai-message">
            <div class="message-content">
              Hello! I'm your educational AI assistant. I can help you with academic subjects, programming, mathematics, science, engineering, and study-related topics. How can I help you today?
            </div>
          </div>
          <!-- Messages will be injected here -->
        </div>
        
        <div id="chat-error" class="error-message chat-error"></div>
        
        <div class="chat-input-area">
          <form id="chat-form">
            <textarea id="message-input" placeholder="Ask an educational question... e.g., Explain AVL trees in simple words" rows="2" required></textarea>
            <button type="submit" id="send-btn" class="primary-btn send-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
