<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - Reset Password</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app" class="auth-container">
      <h1>EduAI</h1>
      
      <div class="auth-card" id="request-reset-card">
        <h2>Reset Password</h2>
        <p>Enter your email to receive a password reset link.</p>
        <form id="request-reset-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div id="request-error" class="error-message"></div>
          <div id="request-success" class="success-message"></div>
          <button type="submit" class="primary-btn" id="request-btn">Send Reset Link</button>
        </form>
        <div class="auth-links">
          <a href="/index.html">Back to Login</a>
        </div>
      </div>

      <div class="auth-card" id="update-password-card" style="display: none;">
        <h2>Set New Password</h2>
        <form id="update-password-form">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="password-input">
              <input type="password" id="new-password" required>
              <button type="button" id="toggle-new-password" class="toggle-btn">Show</button>
            </div>
            <small class="help-text">At least 6 characters</small>
          </div>
          <div class="form-group">
            <label for="confirm-new-password">Confirm New Password</label>
            <div class="password-input">
              <input type="password" id="confirm-new-password" required>
              <button type="button" id="toggle-confirm-new-password" class="toggle-btn">Show</button>
            </div>
          </div>
          <div id="update-error" class="error-message"></div>
          <div id="update-success" class="success-message"></div>
          <button type="submit" class="primary-btn" id="update-btn">Update Password</button>
        </form>
      </div>

    </div>
    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>
