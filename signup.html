<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - Sign Up</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app" class="auth-container">
      <h1>EduAI</h1>
      <p>Create your account</p>
      
      <div class="auth-card">
        <h2>Sign Up</h2>
        <form id="signup-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" required>
              <button type="button" id="toggle-password" class="toggle-btn">Show</button>
            </div>
            <small class="help-text">At least 6 characters</small>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-input">
              <input type="password" id="confirm-password" required>
              <button type="button" id="toggle-confirm-password" class="toggle-btn">Show</button>
            </div>
          </div>
          <div id="auth-error" class="error-message"></div>
          <div id="auth-success" class="success-message"></div>
          <button type="submit" class="primary-btn" id="signup-btn">Create Account</button>
        </form>
        
        <div class="auth-links">
          <span>Already have an account? <a href="/index.html">Login</a></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/signup.js"></script>
  </body>
</html>
